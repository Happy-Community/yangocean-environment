<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<title>သစ်ပင် ကာဗွန်လျှော့ချမှု တွက်ချက်စက်</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-6929570744326515">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6929570744326515"
     crossorigin="anonymous"></script>
<link rel="stylesheet" href="/styles.css">
</head>

<body class="theme-tree">

<div class="container">
<div class="card">

<h1>🌳 သစ်ပင် ကာဗွန်လျှော့ချမှု တွက်ချက်စက်</h1>

<p>လူဦးရေကို ထည့်သွင်းပါ။</p>
<input type="number" id="people" placeholder="ဥပမာ - 4">

<button onclick="calcTree()">တွက်ချက်ရန်</button>

<div id="result" class="result" style="display:none;"></div>

<a class="back" href="../index.html">← ပင်မစာမျက်နှာသို့ ပြန်သွားရန်</a>

</div>
</div>

<script>
function calcTree() {
  let p = document.getElementById("people").value || 0;

  if (p <= 0) {
    alert("ကျေးဇူးပြု၍ မှန်ကန်သော လူဦးရေကို ထည့်သွင်းပါ။");
    return;
  }

  // 🌍 လူတစ်ဦးချင်းစီ၏ CO2 ထုတ်လွှတ်မှု (ကမ္ဘာ့ပျမ်းမျှကို ရိုးရှင်းစွာ ခန့်မှန်းထားသော အတိုင်းအတာ)
  let co2PerPerson = 4000; // kg/နှစ် (ပြင်ဆင်နိုင်သော အခြေခံတန်ဖိုး)

  // 🌳 သစ်ပင်များ၏ ကာဗွန်စုပ်ယူမှု (ပိုမိုလက်တွေ့ကျသော အတိုင်းအတာ)
  let treeMin = 10;  // သစ်တောငယ် သို့မဟုတ် ရောနှောသစ်တော၏ ပျမ်းမျှတန်ဖိုး
  let treeMax = 25;  // ကောင်းမွန်သော အခြေအနေတွင်ရှိသော ရင့်ကျက်သစ်ပင်
  let treeAvg = 18;  // မျှတသော ခန့်မှန်းတန်ဖိုး

  let totalCO2 = p * co2PerPerson;

  let treesMin = Math.ceil(totalCO2 / treeMax);
  let treesMax = Math.ceil(totalCO2 / treeMin);
  let treesAvg = Math.ceil(totalCO2 / treeAvg);

  // 🌬️ အောက်ဆီဂျင် ထုတ်လုပ်မှု ခန့်မှန်းချက် (သိပ္ပံနည်းကျ အနီးစပ်ဆုံး ခန့်မှန်းမှု)
  // ရင့်ကျက်သော သစ်ပင် ၁ ပင်သည် တစ်နှစ်လျှင် အောက်ဆီဂျင် 100–150 kg ခန့် ထုတ်လုပ်နိုင်သည်
  let oxygenPerTree = 120;

  let oxygenTotal = treesAvg * oxygenPerTree;

  // 🌳 မြင်သာစေရန် အုပ်စုခွဲခြင်း (အသုံးပြုသူအတွေ့အကြုံအတွက်သာ၊ သိပ္ပံနည်းကျ မဟုတ်ပါ)
  let largeTrees = Math.round(treesAvg / 3);
  let mediumTrees = Math.round(treesAvg / 2);
  let smallTrees = treesAvg;

  // 🌲 သစ်တောအမျိုးအစား သတ်မှတ်ချက်
  let forestType =
    treesAvg < 50 ? "သစ်ပင်ငယ်အုပ်စု 🌱"
    : treesAvg < 200 ? "အလတ်စား သစ်တော 🌳"
    : "သစ်တောကြီး 🌲";

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML =
    "🌍 စုစုပေါင်း CO₂ ကာဗွန်ခြေရာ: <b>" + totalCO2.toLocaleString() + " kg/နှစ်</b><br><br>" +

    "🌳 သစ်ပင်များဖြင့် ကာဗွန်လျှော့ချနိုင်မှု ခန့်မှန်းချက် (အတိုင်းအတာ):<br>" +
    "• အနိမ့်ဆုံး ခန့်မှန်းချက်: <b>" + treesMax.toLocaleString() + "</b> ပင်<br>" +
    "• စုပ်ယူမှု ထိရောက်မှုမြင့်မားသော ခန့်မှန်းချက်: <b>" + treesMin.toLocaleString() + "</b> ပင်<br>" +
    "• မျှတသော ခန့်မှန်းချက်: <b>" + treesAvg.toLocaleString() + "</b> ပင်<br><br>" +

    "🌱 သစ်တောအရွယ်အစား အမြင်: " + forestType + "<br><br>" +

    "🌬️ ရင့်ကျက်သော သစ်ပင်များအပေါ် အခြေခံထားသော အောက်ဆီဂျင် ထုတ်လုပ်မှု ခန့်မှန်းချက်:<br>" +
    "<b>" + oxygenTotal.toLocaleString() + " kg O₂/နှစ်</b><br><br>" +

    "🌿 မြင်သာစေရန် ခန့်မှန်းအုပ်စုခွဲခြင်း:<br>" +
    "• 🌱 " + smallTrees + " ပင် သစ်ပင်ငယ်များ<br>" +
    "• 🌳 " + mediumTrees + " ပင် အလတ်စား သစ်ပင်များ<br>" +
    "• 🌲 " + largeTrees + " ပင် ရင့်ကျက်သော သစ်ပင်များ<br><br>" +

    "💡 မှတ်ချက်: ဤသည်မှာ ရိုးရှင်းသော ပညာပေးမော်ဒယ်တစ်ခု ဖြစ်ပါသည်။ လက်တွေ့တန်ဖိုးများသည် ရာသီဥတု၊ သစ်ပင်မျိုးစိတ်နှင့် ကြီးထွားမှုအခြေအနေများအပေါ် မူတည်၍ ကွဲပြားနိုင်ပါသည်။<br><br>" +

    "📘 သစ်ပင်များသည် ကာဗွန်ထုတ်လွှတ်မှုကို ချက်ချင်း လျှော့ချပေးနိုင်ခြင်း မဟုတ်ပါ။ ကာဗွန်စုပ်ယူမှုသည် နှစ်ပေါင်းများစွာအတွင်း တဖြည်းဖြည်း ဖြစ်ပေါ်လာပါသည်။";
}
</script>

</body>
</html>
