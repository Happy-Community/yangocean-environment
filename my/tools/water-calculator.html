<meta charset="UTF-8">

<meta name="description"
content="နေ့စဉ် ရေချိုးချိန်နှင့် အိမ်ထောင်စုဝင် အရေအတွက်ကို ထည့်သွင်းပြီး တစ်လစာ ခန့်မှန်းရေသုံးစွဲမှုကို တွက်ချက်ပါ။">

<!-- GLOBAL STYLES ONLY -->
<link rel="stylesheet" href="/styles.css">

</head>

<body class="theme-water">

<div class="container">

<div class="card">

<h1>💧 ရေသုံးစွဲမှု တွက်ချက်စက်</h1>

<p>
တစ်နေ့လျှင် ရေချိုးချိန် (မိနစ်):
</p>

<input
type="number"
id="shower"
min="0"
step="1"
placeholder="ဥပမာ - ၁၀">

<p>
အိမ်ထောင်စုဝင် အရေအတွက်:
</p>

<input
type="number"
id="people"
min="0"
step="1"
placeholder="ဥပမာ - ၄">

<button onclick="calcWater()">
တွက်ချက်ရန်
</button>

<div id="result" class="result" style="display:none;" aria-live="polite"></div>

<a class="back" href="/my/index.html">
← ပင်မစာမျက်နှာသို့ ပြန်သွားရန်
</a>

</div>

</div>

<script>
function calcWater() {

  let showerInput = document.getElementById("shower").value;
  let peopleInput = document.getElementById("people").value;

  let shower = showerInput === "" ? 0 : Number(showerInput);
  let people = peopleInput === "" ? 0 : Number(peopleInput);

  if (
    !Number.isFinite(shower) ||
    !Number.isFinite(people) ||
    shower < 0 ||
    people < 0
  ) {

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML =
      "ကျေးဇူးပြု၍ မှန်ကန်သော အချက်အလက်များကို ထည့်သွင်းပါ။";

    return;

  }

  // ခန့်မှန်းချက်: လူတစ်ဦးလျှင် တစ်မိနစ် ၉ လီတာ
  // တစ်လကို ရက် ၃၀ ဟု ယူဆထားသည်

  let water = shower * people * 9 * 30;

  document.getElementById("result").style.display = "block";

  document.getElementById("result").innerHTML =
    "💧 တစ်လစာ ခန့်မှန်းရေသုံးစွဲမှု: <b>" +
    water.toLocaleString() +
    " လီတာ</b>";

}
</script>

</body>
