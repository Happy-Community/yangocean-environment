<!-- TTS SCRIPT -->
<script>
let speech = null;
let isSpeaking = false;
let isPaused = false;

function buildSpeech() {
  const content = document.getElementById("content-to-read");
  const elements = content.querySelectorAll("h1, h2, h3, p");

  let text = "";
  elements.forEach(el => {
    text += el.innerText + "。 ";
  });

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.rate = 0.95;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onstart = () => {
    isSpeaking = true;
    isPaused = false;
  };

  utterance.onend = () => {
    isSpeaking = false;
    isPaused = false;
  };

  return utterance;
}

function togglePlay() {
  if (isPaused) {
    window.speechSynthesis.resume();
    isPaused = false;
    return;
  }

  if (!isSpeaking) {
    speech = buildSpeech();
    window.speechSynthesis.speak(speech);
  }
}

function pauseReading() {
  if (isSpeaking && !isPaused) {
    window.speechSynthesis.pause();
    isPaused = true;
  }
}

function stopReading() {
  window.speechSynthesis.cancel();
  isSpeaking = false;
  isPaused = false;
}
</script>
