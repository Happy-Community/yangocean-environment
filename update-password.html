<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin:0;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f4f7fb;
    }

    .box {
      width:340px;
      background:#fff;
      padding:24px;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,0.1);
    }

    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
      box-sizing:border-box;
    }

    button {
      background:#2e7d32;
      color:white;
      border:none;
    }

    .msg {
      margin-top:10px;
      text-align:center;
    }

    .error { color:red; }
    .success { color:green; }
  </style>
</head>

<body>

<div class="box">
  <h2>Set New Password</h2>

  <input type="password" id="password" placeholder="New password" />
  <button onclick="updatePassword()">Update Password</button>

  <div id="msg" class="msg"></div>
</div>

<script>
const supabaseUrl = 'https://byzmqdkmwkvkdcxtooxh.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5em1xZGttd2t2a2RjeHRvb3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1MTg1NDAsImV4cCI6MjA2OTA5NDU0MH0.K5kOxNjmwNWGKVtGNg53HLAVftiyYWYZiv7wFttvtpI';

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

function showMsg(text, error=false) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = error ? 'msg error' : 'msg success';
}

// 🔥 CRITICAL FIX: restore session from URL
async function init() {
  const { data, error } =
    await supabaseClient.auth.exchangeCodeForSession(window.location.href);

  console.log("exchange result:", data, error);

  if (error || !data.session) {
    showMsg("Invalid or expired reset link", true);
    return;
  }

  showMsg("Session ready. Enter new password.");
}

async function updatePassword() {
  const password = document.getElementById('password').value;

  if (password.length < 6) {
    showMsg("Password too short", true);
    return;
  }

  const { data, error } =
    await supabaseClient.auth.updateUser({ password });

  console.log("update:", data, error);

  if (error) {
    showMsg(error.message, true);
    return;
  }

  showMsg("Password updated!");

  setTimeout(() => {
    window.location.href = "https://www.yangocean.com";
  }, 1500);
}

init();
</script>

</body>
</html>
