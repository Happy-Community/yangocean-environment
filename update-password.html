<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Update Password - Yangocean</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 24px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #2d6cdf;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2d6cdf;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.95;
    }

    #msg {
      margin-top: 18px;
      font-size: 14px;
    }

    .loading {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>Reset Password</h2>

    <p class="loading" id="loadingText">
      Verifying recovery link...
    </p>

    <div id="formArea" style="display:none;">

      <input
        type="password"
        id="pw1"
        placeholder="New Password"
      />

      <input
        type="password"
        id="pw2"
        placeholder="Confirm Password"
      />

      <button onclick="updatePassword()">
        Update Password
      </button>

    </div>

    <p id="msg"></p>

  </div>

  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabase = createClient(
      "https://byzmqdkmwkvkdcxtooxh.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5em1xZGttd2t2a2RjeHRvb3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1MTg1NDAsImV4cCI6MjA2OTA5NDU0MH0.K5kOxNjmwNWGKVtGNg53HLAVftiyYWYZiv7wFttvtpI"
    );
    
    const msg = document.getElementById("msg");
    const formArea = document.getElementById("formArea");
    const loadingText = document.getElementById("loadingText");

    // STEP 1:
    // Restore auth session from recovery email link

    async function initializeRecovery() {

      try {

        const { error } =
          await supabase.auth.exchangeCodeForSession(
            window.location.href
          );

        if (error) {

          loadingText.innerText =
            "Invalid or expired recovery link.";

          loadingText.style.color = "red";

          return;
        }

        // Recovery session success

        loadingText.style.display = "none";
        formArea.style.display = "block";

      } catch (err) {

        loadingText.innerText =
          "Unable to verify recovery link.";

        loadingText.style.color = "red";
      }
    }

    await initializeRecovery();

    // STEP 2:
    // Update password

    async function updatePassword() {

      const pw1 =
        document.getElementById("pw1").value;

      const pw2 =
        document.getElementById("pw2").value;

      // Validation

      if (!pw1 || !pw2) {

        msg.innerText =
          "Please fill in all fields.";

        msg.style.color = "red";

        return;
      }

      if (pw1 !== pw2) {

        msg.innerText =
          "Passwords do not match.";

        msg.style.color = "red";

        return;
      }

      if (pw1.length < 6) {

        msg.innerText =
          "Password must be at least 6 characters.";

        msg.style.color = "red";

        return;
      }

      // Update password

      const { error } =
        await supabase.auth.updateUser({
          password: pw1
        });

      if (error) {

        msg.innerText = error.message;
        msg.style.color = "red";

      } else {

        msg.innerText =
          "Password updated successfully! Please return to the Yangocean app and login again.";

        msg.style.color = "green";

      }
    }

    window.updatePassword = updatePassword;

  </script>

</body>
</html>
