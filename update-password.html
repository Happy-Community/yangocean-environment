<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Password - Yangocean</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 24px;
      border-radius: 14px;
      width: 320px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 { color: #2d6cdf; margin-top: 0; }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2d6cdf;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #msg {
      margin-top: 15px;
      font-size: 14px;
    }

    .loading {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Reset Password</h2>

  <p id="loadingText" class="loading">Verifying recovery link...</p>

  <div id="formArea" style="display:none;">
    <input type="password" id="pw1" placeholder="New Password" />
    <input type="password" id="pw2" placeholder="Confirm Password" />
    <button onclick="updatePassword()">Update Password</button>
  </div>

  <p id="msg"></p>

</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://byzmqdkmwkvkdcxtooxh.supabase.co",
  "YOUR_ANON_KEY"
);

const msg = document.getElementById("msg");
const loadingText = document.getElementById("loadingText");
const formArea = document.getElementById("formArea");

// --------------------------------------------------
// STEP 1: RECOVERY HANDLING (FIXED)
// --------------------------------------------------

async function initializeRecovery() {

  try {

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    // 🔥 CRITICAL FIX: exchange code → session
    if (code) {
      const { error } =
        await supabase.auth.exchangeCodeForSession(code);

      if (error) {
        loadingText.innerText = "Invalid or expired recovery link.";
        loadingText.style.color = "red";
        return;
      }
    }

    // check session
    const { data } = await supabase.auth.getSession();

    if (data?.session) {
      loadingText.style.display = "none";
      formArea.style.display = "block";
      return;
    }

    loadingText.innerText = "Invalid or expired recovery link.";
    loadingText.style.color = "red";

  } catch (err) {
    loadingText.innerText = "Error verifying link.";
    loadingText.style.color = "red";
  }
}

initializeRecovery();

// --------------------------------------------------
// STEP 2: UPDATE PASSWORD
// --------------------------------------------------

async function updatePassword() {

  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;

  msg.style.color = "red";

  if (!pw1 || !pw2) {
    msg.innerText = "Please fill in all fields.";
    return;
  }

  if (pw1 !== pw2) {
    msg.innerText = "Passwords do not match.";
    return;
  }

  if (pw1.length < 6) {
    msg.innerText = "Password must be at least 6 characters.";
    return;
  }

  const { error } = await supabase.auth.updateUser({
    password: pw1
  });

  if (error) {
    msg.innerText = error.message;
    return;
  }

  msg.style.color = "green";
  msg.innerText = "Password updated successfully!";

  setTimeout(() => {
    window.location.href = "https://www.yangocean.com";
  }, 2000);
}

window.updatePassword = updatePassword;

</script>

</body>
</html>
