<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<title>Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  width:340px;
  background:#fff;
  padding:28px;
  border-radius:12px;
  box-shadow:0 4px 14px rgba(0,0,0,0.1);
}

h2{text-align:center;}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#2e7d32;
  color:#fff;
  font-size:16px;
}

button:disabled{opacity:0.6;}

.msg{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

.error{color:red;}
.success{color:green;}
</style>
</head>

<body>

<div class="box">
  <h2>Reset Password</h2>

  <input type="password" id="password" placeholder="New password" />

  <button id="btn" onclick="updatePassword()">Update Password</button>

  <div id="msg" class="msg"></div>
</div>

<script>

// ------------------- SUPABASE -------------------
const SUPABASE_URL = 'https://byzmqdkmwkvkdcxtooxh.supabase.co';
const SUPABASE_ANON_KEY =  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5em1xZGttd2t2a2RjeHRvb3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1MTg1NDAsImV4cCI6MjA2OTA5NDU0MH0.K5kOxNjmwNWGKVtGNg53HLAVftiyYWYZiv7wFttvtpI';

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true
    }
  }
);

// -------------------
let sessionReady = false;

function showMsg(text, error=false){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = error ? 'msg error' : 'msg success';
}

// ------------------- SESSION RESTORE -------------------
async function restoreSession() {
  try {

    showMsg("Loading reset link...", false);

    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");

    if (!code) {
      showMsg("Invalid reset link", true);
      return;
    }

    const { data, error } =
      await supabaseClient.auth.exchangeCodeForSession(code);

    if (error) {
      console.error(error);
      showMsg("Reset link expired or invalid", true);
      return;
    }

    sessionReady = true;
    showMsg("Session ready. You can reset password.", false);

  } catch (e) {
    console.error(e);
    showMsg("Session restore failed", true);
  }
}

// ------------------- UPDATE PASSWORD -------------------
async function updatePassword() {

  const btn = document.getElementById('btn');
  const password = document.getElementById('password').value;

  if (!sessionReady) {
    showMsg("Session not ready yet", true);
    return;
  }

  if (password.length < 6) {
    showMsg("Password must be at least 6 characters", true);
    return;
  }

  try {

    btn.disabled = true;

    const { error } = await supabaseClient.auth.updateUser({
      password
    });

    if (error) {
      console.error(error);
      showMsg(error.message, true);
      btn.disabled = false;
      return;
    }

    showMsg("Password updated successfully!", false);

    setTimeout(() => {
      window.location.href = "https://www.yangocean.com";
    }, 1500);

  } catch (e) {
    console.error(e);
    showMsg("Unexpected error", true);
    btn.disabled = false;
  }
}

// -------------------
window.addEventListener("load", restoreSession);

</script>

</body>
</html>
