<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin:0;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f4f7fb;
    }

    .box {
      width:340px;
      background:#fff;
      padding:24px;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,0.1);
    }

    input, button {
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button {
      background:#2e7d32;
      color:white;
      border:none;
    }

    .msg {
      margin-top:10px;
      text-align:center;
    }

    .error { color:red; }
    .success { color:green; }
  </style>
</head>

<body>

<div class="box">
  <h2>Set New Password</h2>

  <input type="password" id="password" placeholder="New password" />
  <button onclick="updatePassword()">Update Password</button>

  <div id="msg" class="msg"></div>
</div>

<script>
const supabase = supabase.createClient(
  'https://byzmqdkmwkvkdcxtooxh.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5em1xZGttd2t2a2RjeHRvb3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1MTg1NDAsImV4cCI6MjA2OTA5NDU0MH0.K5kOxNjmwNWGKVtGNg53HLAVftiyYWYZiv7wFttvtpI'

);

// detect session automatically from Supabase recovery redirect
async function checkSession() {
  const { data, error } = await supabase.auth.getSession();

  if (error || !data.session) {
    document.getElementById('msg').innerText =
      "Session not ready. Please reopen reset email link.";
  } else {
    document.getElementById('msg').innerText =
      "Ready to reset password.";
  }
}

async function updatePassword() {
  const password = document.getElementById('password').value;

  if (password.length < 6) {
    document.getElementById('msg').innerText =
      "Password too short";
    return;
  }

  const { error } = await supabase.auth.updateUser({
    password: password
  });

  if (error) {
    document.getElementById('msg').innerText = error.message;
    return;
  }

  document.getElementById('msg').innerText =
    "Password updated! Redirecting...";

  setTimeout(() => {
    window.location.href = "https://www.yangocean.com";
  }, 1500);
}

checkSession();
</script>

</body>
</html>
