<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <title>Reset Password - Yangocean</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f7fb;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
    }

    .container {
      background: white;
      width: 340px;

      padding: 30px;

      border-radius: 14px;

      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;

      border-radius: 8px;
      border: 1px solid #ccc;

      box-sizing: border-box;

      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;

      margin-top: 16px;

      border: none;
      border-radius: 8px;

      background: #2e7d32;
      color: white;

      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: red;
    }

    .success {
      color: green;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Reset Password</h2>

    <input
      type="password"
      id="password"
      placeholder="Enter new password"
    />

    <button
      id="submitBtn"
      onclick="updatePassword()"
    >
      Update Password
    </button>

    <div
      class="message"
      id="message"
    ></div>

  </div>

  <script>

    // --------------------------------------------------
    // SUPABASE CONFIG
    // --------------------------------------------------

    const SUPABASE_URL =
      'https://byzmqdkmwkvkdcxtooxh.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5em1xZGttd2t2a2RjeHRvb3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM1MTg1NDAsImV4cCI6MjA2OTA5NDU0MH0.K5kOxNjmwNWGKVtGNg53HLAVftiyYWYZiv7wFttvtpI';


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    // --------------------------------------------------
    // SESSION STATE
    // --------------------------------------------------

    let sessionReady = false;

    // --------------------------------------------------
    // MESSAGE HELPER
    // --------------------------------------------------

    function showMessage(message, isError) {

      const el =
        document.getElementById('message');

      el.innerText = message;

      el.className =
        isError
          ? 'message error'
          : 'message success';
    }

    // --------------------------------------------------
    // RESTORE SESSION FROM URL
    // --------------------------------------------------

    async function restoreSessionFromUrl() {

      try {

        // Read query params
        const queryParams =
          new URLSearchParams(
            window.location.search
          );

        // Read hash params
        const hashParams =
          new URLSearchParams(
            window.location.hash.substring(1)
          );

        // Support BOTH formats
        const access_token =
          queryParams.get('access_token') ||
          hashParams.get('access_token');

        const refresh_token =
          queryParams.get('refresh_token') ||
          hashParams.get('refresh_token');

        console.log('access_token:', access_token);
        console.log('refresh_token:', refresh_token);

        if (!access_token || !refresh_token) {

          showMessage(
            'Invalid or expired recovery link.',
            true
          );

          return;
        }

        // Restore session
        const { error } =
          await supabaseClient.auth.setSession({
            access_token,
            refresh_token
          });

        if (error) {

          console.error(error);

          showMessage(
            error.message,
            true
          );

          return;
        }

        sessionReady = true;

        console.log(
          'Session restored successfully'
        );

      } catch (e) {

        console.error(e);

        showMessage(
          'Unable to restore session.',
          true
        );
      }
    }

    // --------------------------------------------------
    // UPDATE PASSWORD
    // --------------------------------------------------

    async function updatePassword() {

      const button =
        document.getElementById('submitBtn');

      const password =
        document.getElementById('password').value;

      if (!sessionReady) {

        showMessage(
          'Auth session expired.',
          true
        );

        return;
      }

      if (password.length < 6) {

        showMessage(
          'Password must be at least 6 characters.',
          true
        );

        return;
      }

      try {

        button.disabled = true;

        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {

          console.error(error);

          showMessage(
            error.message,
            true
          );

          button.disabled = false;

          return;
        }

        showMessage(
          'Password updated successfully!',
          false
        );

        // Optional redirect
        setTimeout(() => {

          window.location.href =
            'https://www.yangocean.com';

        }, 2000);

      } catch (e) {

        console.error(e);

        showMessage(
          'Unexpected error occurred.',
          true
        );

        button.disabled = false;
      }
    }

    // --------------------------------------------------
    // INITIALIZE
    // --------------------------------------------------

    restoreSessionFromUrl();

  </script>

</body>

</html>
