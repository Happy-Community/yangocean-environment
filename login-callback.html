    const supabase = createClient(
      "https://byzmqdkmwkvkdcxtooxh.supabase.co",

    );
    
    async function handleLogin() {
      const { error } = await supabase.auth.getSessionFromUrl({
        storeSession: true
      });

      if (error) {
        document.body.innerHTML = "Login failed. Please try again.";
        return;
      }

      // Redirect back to app (you can change this)
      window.location.href = "https://www.yangocean.com";
    }

    handleLogin();
  </script>
